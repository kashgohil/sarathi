[project]
name = "sarathi-sidecar"
version = "0.0.1"
description = "Local-first ML sidecar for Sarathi: ASR, RAG, and answer generation."
requires-python = ">=3.11,<3.13"
readme = "README.md"
authors = [{ name = "Sarathi" }]

dependencies = [
    # CLI / app
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version<'3.11'",
    "platformdirs>=4.2",

    # Text processing
    "regex>=2024.5.15",                # for grapheme \X
    "indic-nlp-library>=0.92",
    "pysbd>=0.3.4",
    "transformers>=4.44",              # XLMRobertaTokenizer for chunk-counting

    # Ingest
    "pymupdf>=1.24",
    "fasttext-wheel>=0.9.2",           # binary wheel; lid.176 model loaded at runtime

    # Storage
    "sqlite-utils>=3.36",
]

[project.optional-dependencies]
# Heavy ML deps kept optional so contributors can iterate on text/ingest without them.
ml = [
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
    "FlagEmbedding>=1.2.10",
    "lancedb>=0.13",
    "mlx-lm>=0.18",
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pyannote.audio>=3.3",
    "torch>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
]

[project.scripts]
sarathi = "sarathi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarathi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
